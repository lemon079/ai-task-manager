<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#707ee6" />
      <stop offset="100%" stop-color="#5e6ad2" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Rounded Geometric Frame -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="none" stroke="#27272a" stroke-width="6" />

  <!-- Floating AI Neural Sparkle (top-right) -->
  <path d="M 336 150 C 336 168 348 180 366 180 C 348 180 336 192 336 210 C 336 192 324 180 306 180 C 324 180 336 168 336 150 Z" fill="url(#sparkleGrad)" />

  <!-- Sleek Modern Checkmark with Linear Aesthetic -->
  <path d="M 170 265 L 230 325 L 342 205" fill="none" stroke="url(#primaryGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Accent Neural Connection Node -->
  <circle cx="170" cy="265" r="8" fill="#ffffff" />
  <circle cx="230" cy="325" r="8" fill="#ffffff" />
  <circle cx="342" cy="205" r="9" fill="#ffffff" />
</svg>
